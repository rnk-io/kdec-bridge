<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">KDEC Bridge architecture</title>
  <desc id="desc">KDEC Bridge runs a userspace Tailscale node on the phone and carries two services over it. KDE Connect: the bridge sends the computer's identity packet to KDE Connect over loopback UDP, KDE Connect connects to the bridge on 127.0.0.1:1717, and the bridge forwards the connection to kdeconnectd on the computer; TLS runs end to end. ADB: adb and scrcpy on the computer connect to the phone's tailnet address on port 5555, and the bridge forwards the connection to adbd on loopback. A separate VPN app keeps the phone's VPN slot.</desc>
  <style>
    svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .bg { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .spk { fill: #d0d7de; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .hl { fill: #ddf4ff; stroke: #1f6feb; stroke-width: 1.5; }
    .vpn { fill: #ffffff; stroke: #8c959f; stroke-dasharray: 5 4; }
    .pill { fill: #ffffff; stroke: #1f6feb; stroke-width: 1.5; }
    .iconbg { fill: #1f6feb; }
    .cap { fill: #59636e; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; }
    .h { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .h2 { fill: #1f2328; font-size: 13.5px; font-weight: 600; }
    .p { fill: #59636e; font-size: 12.5px; }
    .m { fill: #59636e; font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .line { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .dash { stroke: #8c959f; stroke-width: 1.25; stroke-dasharray: 5 4; fill: none; }
    .acc { stroke: #1f6feb; stroke-width: 2.5; fill: none; }
    .lock { stroke: #8c959f; stroke-width: 1.5; fill: none; }
    .check { stroke: #1a7f37; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .ah { fill: #59636e; }
    .aha { fill: #1f6feb; }
    .num { fill: #1f6feb; }
    .numt { fill: #ffffff; font-size: 11px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .spk { fill: #30363d; }
      .box { fill: #0d1117; stroke: #30363d; }
      .hl { fill: #0f2a4d; stroke: #4493f8; }
      .vpn { fill: #0d1117; stroke: #6e7681; }
      .pill { fill: #0d1117; stroke: #4493f8; }
      .cap, .p, .m { fill: #9198a1; }
      .h, .h2 { fill: #e6edf3; }
      .line { stroke: #9198a1; }
      .dash, .lock { stroke: #6e7681; }
      .acc { stroke: #4493f8; }
      .check { stroke: #3fb950; }
      .ah { fill: #9198a1; }
      .aha, .num { fill: #4493f8; }
      .numt { fill: #0d1117; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path class="aha" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="960" height="600" rx="16"/>

  <!-- Phone -->
  <rect class="panel" x="24" y="24" width="380" height="500" rx="28"/>
  <rect class="spk" x="184" y="34" width="60" height="5" rx="2.5"/>
  <text class="cap" x="48" y="62">ANDROID PHONE</text>

  <rect class="panel" x="636" y="24" width="300" height="500" rx="20"/>
  <text class="cap" x="660" y="62">COMPUTER</text>

  <rect class="box" x="48" y="80" width="332" height="64" rx="12"/>
  <text class="h" x="68" y="107">KDE Connect</text>
  <text class="p" x="68" y="127">Stock app, unmodified</text>

  <line class="line" x1="190" y1="204" x2="190" y2="146" marker-end="url(#a)"/>
  <circle class="num" cx="190" cy="175" r="10"/>
  <text class="numt" x="190" y="179" text-anchor="middle">1</text>
  <text class="p" x="172" y="171" text-anchor="end">Identity packet</text>
  <text class="m" x="172" y="187" text-anchor="end">UDP 127.0.0.1:1716</text>

  <line class="line" x1="238" y1="146" x2="238" y2="204" marker-end="url(#a)"/>
  <circle class="num" cx="238" cy="175" r="10"/>
  <text class="numt" x="238" y="179" text-anchor="middle">2</text>
  <text class="p" x="256" y="171">Connects</text>
  <text class="m" x="256" y="187">TCP 127.0.0.1:1717</text>

  <rect class="hl" x="48" y="206" width="332" height="84" rx="12"/>
  <text class="h" x="68" y="236">KDEC Bridge</text>
  <text class="p" x="68" y="256">Userspace Tailscale, no VpnService</text>
  <text class="p" x="68" y="274">Forwards KDE Connect and ADB</text>
  <g transform="translate(326 230)">
    <rect class="iconbg" width="36" height="36" rx="9"/>
    <path transform="translate(6 6)" fill="#ffffff" d="M3.9,12c0,-1.71 1.39,-3.1 3.1,-3.1h4L11,7L7,7c-2.76,0 -5,2.24 -5,5s2.24,5 5,5h4v-1.9L7,15.1c-1.71,0 -3.1,-1.39 -3.1,-3.1zM8,13h8v-2L8,11v2zM17,7h-4v1.9h4c1.71,0 3.1,1.39 3.1,3.1s-1.39,3.1 -3.1,3.1h-4L13,17h4c2.76,0 5,-2.24 5,-5s-2.24,-5 -5,-5z"/>
  </g>

  <line class="line" x1="214" y1="292" x2="214" y2="350" marker-end="url(#a)"/>
  <circle class="num" cx="214" cy="321" r="10"/>
  <text class="numt" x="214" y="325" text-anchor="middle">B</text>
  <text class="p" x="232" y="317">Forwards</text>
  <text class="m" x="232" y="333">TCP 127.0.0.1:5555</text>

  <rect class="box" x="48" y="352" width="332" height="64" rx="12"/>
  <text class="h" x="68" y="379">adbd</text>
  <text class="p" x="68" y="399">Android's ADB daemon, in TCP mode</text>

  <rect class="vpn" x="48" y="440" width="332" height="66" rx="12"/>
  <text class="h" x="68" y="468">Any VPN app</text>
  <text class="p" x="68" y="488">Keeps the phone's only VPN slot</text>
  <rect class="lock" x="340" y="467" width="20" height="16" rx="3"/>
  <path class="lock" d="M344,467 v-5 a6,6 0 0 1 12,0 v5"/>

  <!-- End-to-end sessions -->
  <line class="dash" x1="380" y1="112" x2="660" y2="112"/>
  <text class="p" x="520" y="104" text-anchor="middle">KDE Connect: end-to-end TLS</text>

  <line class="dash" x1="380" y1="384" x2="660" y2="384"/>
  <text class="p" x="520" y="376" text-anchor="middle">ADB: key allowed on the phone</text>

  <!-- Tailnet tunnel -->
  <text class="p" x="520" y="214" text-anchor="middle">Both forwarded over WireGuard</text>
  <line class="acc" x1="382" y1="248" x2="658" y2="248" marker-start="url(#b)" marker-end="url(#b)"/>
  <rect class="pill" x="466" y="230" width="108" height="36" rx="18"/>
  <text class="h2" x="520" y="253" text-anchor="middle">Tailnet</text>
  <text class="p" x="520" y="290" text-anchor="middle">Direct peer-to-peer,</text>
  <text class="p" x="520" y="306" text-anchor="middle">or via a DERP relay</text>

  <!-- Computer -->

  <rect class="box" x="660" y="80" width="252" height="64" rx="12"/>
  <text class="h" x="680" y="107">kdeconnectd</text>
  <text class="p" x="680" y="127">KDE Connect daemon</text>

  <line class="line" x1="786" y1="204" x2="786" y2="146" marker-end="url(#a)"/>
  <text class="m" x="800" y="179">TCP :1716</text>

  <rect class="box" x="660" y="206" width="252" height="84" rx="12"/>
  <text class="h" x="680" y="236">Tailscale</text>
  <text class="p" x="680" y="256">Standard client</text>
  <text class="p" x="680" y="274">On the same tailnet as the phone</text>

  <line class="line" x1="786" y1="350" x2="786" y2="292" marker-end="url(#a)"/>
  <circle class="num" cx="786" cy="321" r="10"/>
  <text class="numt" x="786" y="325" text-anchor="middle">A</text>
  <text class="m" x="804" y="325">phone:5555</text>

  <rect class="box" x="660" y="352" width="252" height="64" rx="12"/>
  <text class="h" x="680" y="379">adb, scrcpy</text>
  <text class="p" x="680" y="399">Connect by the phone's tailnet name</text>

  <path class="check" d="M680,455 l4,4 l8,-9"/>
  <text class="p" x="700" y="460">No open ports</text>
  <path class="check" d="M680,477 l4,4 l8,-9"/>
  <text class="p" x="700" y="482">No port forwarding</text>
  <path class="check" d="M680,499 l4,4 l8,-9"/>
  <text class="p" x="700" y="504">No relay server to run</text>

  <text class="p" x="480" y="560" text-anchor="middle">KDE Connect sees the computer as a local device; adb and scrcpy reach the phone by its tailnet name.</text>
  <text class="p" x="480" y="578" text-anchor="middle">The bridge only forwards bytes. Pairing, TLS and ADB authentication are unchanged.</text>
</svg>
